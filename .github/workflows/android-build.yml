name: Neon Survivor APK Build

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.3"
  ANDROID_HOME: /usr/lib/android-sdk

jobs:
  android-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -name project.godot -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname 'neon-survivor*.zip' -print \
              | sort -V \
              | tail -n 1
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: project.godot veya Neon Survivor ZIP bulunamadi."
              exit 1
            fi

            echo "ZIP bulundu: $ZIP_FILE"

            if ! command -v unzip >/dev/null 2>&1; then
              apt-get update
              apt-get install -y unzip
            fi

            EXTRACT_DIR="$GITHUB_WORKSPACE/_godot_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -maxdepth 8 -type f -name project.godot -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Setup Godot CI
        shell: bash
        run: |
          set -euo pipefail

          chmod -R u+rwX "$PROJECT_DIR"

          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"

          rm -rf "$HOME/.config/godot"
          cp -a /root/.config/godot "$HOME/.config/godot"

          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Install required Android 34 packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Fix Android texture import setting
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # IMPORTANT:
          # project.godot uses section-relative keys.
          # Under [rendering], this MUST be:
          # textures/vram_compression/import_etc2_astc=true
          sed -i '/^rendering\/textures\/vram_compression\/import_etc2_astc=/d' project.godot
          sed -i '/^textures\/vram_compression\/import_etc2_astc=/d' project.godot

          if grep -q '^\[rendering\]' project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> project.godot
          fi

          rm -rf .godot

          echo "Verified setting:"
          grep -n '^textures/vram_compression/import_etc2_astc=true$' project.godot

      - name: Write clean Android export preset
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/neon-survivor-debug.apk"
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          package/unique_name="com.elxvro.neonsurvivor"
          package/name="Neon Survivor"
          version/code=8
          version/name="0.1.8"
          screen/immersive_mode=true
          EOF

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --verbose --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p build/android

          godot --headless --verbose --path . \
            --export-debug "Android Debug" \
            "build/android/neon-survivor-debug.apk"

          test -s build/android/neon-survivor-debug.apk

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/android/neon-survivor-debug.apk \
            "$GITHUB_WORKSPACE/artifacts/neon-survivor-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/artifacts/neon-survivor-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-v0.1.8-apk
          path: artifacts/neon-survivor-debug.apk
          if-no-files-found: error
          retention-days: 14
