name: Neon Survivor APK Build

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  ANDROID_HOME: /usr/lib/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

jobs:
  android-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -name project.godot -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
              \( -iname 'neon-survivor*.zip' -o -iname '*.zip' \) \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: project.godot veya proje ZIP'i bulunamadi."
              exit 1
            fi

            echo "ZIP bulundu: $ZIP_FILE"

            if ! command -v unzip >/dev/null 2>&1; then
              apt-get update
              apt-get install -y unzip
            fi

            EXTRACT_DIR="$GITHUB_WORKSPACE/_godot_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -maxdepth 8 -type f -name project.godot -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Fix project permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod -R u+rwX "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/.godot/editor"
          chmod -R u+rwX "$PROJECT_DIR/.godot"

      - name: Install Android SDK 34 requirements
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo "Installed Android packages:"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed

      - name: Prepare Godot export environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            rm -rf "$HOME/.local/share/godot/export_templates/4.3.stable"
            cp -R "/root/.local/share/godot/export_templates/4.3.stable" \
              "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

          if [ -f "/root/debug.keystore" ]; then
            cp /root/debug.keystore "$HOME/.android/debug.keystore"
          elif [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          chmod 600 "$HOME/.android/debug.keystore"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

          echo "Godot editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Normalize Android export preset
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f export_presets.cfg ]; then
            cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/neon-survivor-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="34"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=5
          version/name="0.1.5"
          package/unique_name="com.elxvro.neonsurvivor"
          package/name="Neon Survivor"
          package/signed=true
          screen/immersive_mode=true
          EOF
          fi

          sed -i 's|gradle_build/min_sdk=""|gradle_build/min_sdk="23"|g' export_presets.cfg
          sed -i 's|gradle_build/target_sdk=""|gradle_build/target_sdk="34"|g' export_presets.cfg

          PRESET_NAME="$(awk -F'"' '/^name=/{print $2; exit}' export_presets.cfg)"

          if [ -z "$PRESET_NAME" ]; then
            echo "ERROR: Android export preset adi okunamadi."
            cat export_presets.cfg
            exit 1
          fi

          echo "EXPORT_PRESET=$PRESET_NAME" >> "$GITHUB_ENV"
          echo "Detected preset: $PRESET_NAME"
          echo "export_presets.cfg:"
          cat export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build

          echo "Building with preset: $EXPORT_PRESET"
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"

          godot --headless --verbose --path . \
            --export-debug "$EXPORT_PRESET" \
            "build/neon-survivor-debug.apk"

          test -s build/neon-survivor-debug.apk
          ls -lh build/neon-survivor-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-v0.1.5-apk
          path: ${{ env.PROJECT_DIR }}/build/neon-survivor-debug.apk
          if-no-files-found: error
          retention-days: 14
