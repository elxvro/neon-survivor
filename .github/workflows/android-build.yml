name: Neon Survivor APK Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  android-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -name project.godot -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot repo icinde acik halde yok. ZIP aranacak."

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
              \( -iname 'neon-survivor*.zip' -o -iname '*.zip' \) \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Ne project.godot ne de ZIP dosyasi bulundu."
              echo "Repo kokune Neon Survivor proje ZIP'ini yukleyin."
              exit 1
            fi

            echo "ZIP bulundu: $ZIP_FILE"

            if ! command -v unzip >/dev/null 2>&1; then
              apt-get update
              apt-get install -y unzip
            fi

            EXTRACT_DIR="$GITHUB_WORKSPACE/_godot_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -maxdepth 8 -type f -name project.godot -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: ZIP acildi fakat project.godot bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

          echo "Proje klasoru:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -100

      - name: Fix project permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod -R u+rwX "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/.godot/editor"
          chmod -R u+rwX "$PROJECT_DIR/.godot"

      - name: Prepare Godot CI environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            rm -rf "$HOME/.local/share/godot/export_templates/4.3.stable"
            cp -R "/root/.local/share/godot/export_templates/4.3.stable" \
              "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi

          if [ -f "/root/.config/godot/editor_settings-4.3.tres" ]; then
            cp "/root/.config/godot/editor_settings-4.3.tres" \
              "$HOME/.config/godot/editor_settings-4.3.tres"
          fi

          test -d "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Ensure Android export preset
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f export_presets.cfg ]; then
            cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/neon-survivor-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          package/unique_name="com.elxvro.neonsurvivor"
          package/name="Neon Survivor"
          version/code=3
          version/name="0.1.3"
          screen/immersive_mode=true
          EOF
          fi

          echo "export_presets.cfg:"
          cat export_presets.cfg

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android" \
            "build/neon-survivor-debug.apk"

          test -s build/neon-survivor-debug.apk
          ls -lh build/neon-survivor-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-v0.1.3-apk
          path: ${{ env.PROJECT_DIR }}/build/neon-survivor-debug.apk
          if-no-files-found: error
          retention-days: 14
