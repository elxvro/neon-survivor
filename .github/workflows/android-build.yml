name: Neon Survivor APK Build

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  ANDROID_HOME: /usr/lib/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

jobs:
  android-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract newest Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -name project.godot -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname 'neon-survivor*.zip' -print \
              | sort -V \
              | tail -n 1
            )"

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(
                find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print \
                | sort -V \
                | tail -n 1
              )"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: project.godot veya proje ZIP'i bulunamadi."
              exit 1
            fi

            echo "ZIP bulundu: $ZIP_FILE"

            if ! command -v unzip >/dev/null 2>&1; then
              apt-get update
              apt-get install -y unzip
            fi

            EXTRACT_DIR="$GITHUB_WORKSPACE/_godot_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -maxdepth 8 -type f -name project.godot -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Prepare Godot CI environment
        shell: bash
        run: |
          set -euo pipefail

          chmod -R u+rwX "$PROJECT_DIR"

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          if [ -d "/root/.config/godot" ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi

          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -a /root/.local/share/godot/export_templates/. \
              "$HOME/.local/share/godot/export_templates/"
          fi

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f /root/debug.keystore

      - name: Install Android 34 toolchain
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Fix Android project settings
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # Godot 4.3 Android export can fail with an empty configuration-error
          # message when ETC2/ASTC mobile texture import is disabled.
          sed -i '/^rendering\/textures\/vram_compression\/import_etc2_astc=/d' project.godot

          if grep -q '^\[rendering\]' project.godot; then
            sed -i '/^\[rendering\]/a rendering/textures/vram_compression/import_etc2_astc=true' project.godot
          else
            printf '\n[rendering]\nrendering/textures/vram_compression/import_etc2_astc=true\n' >> project.godot
          fi

          # Force a clean import after changing texture-compression settings.
          rm -rf .godot
          mkdir -p .godot/editor

          echo "Android texture setting:"
          grep -n 'rendering/textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Write known-good Android export preset
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/neon-survivor-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=7
          version/name="0.1.7"
          package/unique_name="com.elxvro.neonsurvivor"
          package/name="Neon Survivor"
          package/signed=true
          graphics/opengl_debug=false
          screen/immersive_mode=true
          EOF

          cat export_presets.cfg

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --verbose --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android Debug" \
            "build/neon-survivor-debug.apk"

          test -s build/neon-survivor-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/neon-survivor-debug.apk \
            "$GITHUB_WORKSPACE/artifacts/neon-survivor-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/artifacts/neon-survivor-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-v0.1.7-apk
          path: artifacts/neon-survivor-debug.apk
          if-no-files-found: error
          retention-days: 14
